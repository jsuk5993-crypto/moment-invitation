name: MOMENT TEST Worker deployment smoke check

on:
  push:
    branches:
      - feat/build14-payment-test
    paths:
      - 'worker/src/**'
      - 'site/payment/**'
      - 'site/index.html'
      - '.github/workflows/moment-deploy-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage-version:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Poll public Cloudflare TEST diagnostics for matching deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://moment-payments-test.jsuk5993-1ae.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            echo "TEST Worker version check attempt $attempt of 6"
            if curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
                -H 'Origin: https://jsuk5993-crypto.github.io' "$BASE/api/health" -o health.json \
              && curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
                -H 'Origin: https://jsuk5993-crypto.github.io' "$BASE/api/payment-setup" -o setup.json \
              && curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
                -H 'Origin: https://jsuk5993-crypto.github.io' "$BASE/api/ui-health" -o ui.json \
              && python3 - <<'PY'
          import json
          health=json.load(open('health.json'))
          setup=json.load(open('setup.json'))
          ui=json.load(open('ui.json'))
          print('Cloudflare TEST health build:', health.get('build'))
          print('Cloudflare TEST setup build:', setup.get('build'))
          print('Checkout checkbox style ready:', ui.get('checkboxStyleReady'))
          print('Checkout frontend JS ready:', ui.get('checkoutClientReady'))
          print('Same-order confirmation retry ready:', ui.get('checkoutResumeReady'))
          print('Secure one-time recovery backup ready:', ui.get('recoveryBackupReady'))
          print('Premium PNG editor guide ready:', ui.get('premiumDeliveryGuideReady'))
          print('Build39 PNG ZIP validation ready:', ui.get('pngZipVerified'))
          print('Mode:', setup.get('mode'), 'Staging gate required:', setup.get('testAccessRequired'))
          assert health.get('ok') is True
          assert health.get('build') == '39'
          assert setup.get('build') == '39'
          assert setup.get('mode') == 'test'
          assert setup.get('testAccessRequired') is True
          assert ui.get('ok') is True, 'Deployed checkout checkbox or payment resume fix is missing'
          assert ui.get('checkoutResumeReady') is True, 'Same-order payment confirmation retry unavailable'
          assert ui.get('recoveryBackupReady') is True, 'Recovery TXT file save is unavailable'
          assert ui.get('premiumDeliveryGuideReady') is True, 'Premium PNG editor readiness guide unavailable'
          assert ui.get('pngZipVerified') is True, 'Latest PNG ZIP validation is not deployed'
          print('PASS: live TEST Worker diagnostics match Build 39')
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::TEST Worker build 36 has not been confirmed; check Cloudflare deployment."
          exit 1


  verify-payment-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check TEST database, all private R2 assets, and payment readiness without credentials
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://moment-payments-test.jsuk5993-1ae.workers.dev"
          for NAME in db-health r2-health payment-setup; do
            echo "Checking /api/$NAME"
            curl -sS --retry 2 --connect-timeout 8 --max-time 20 \
              -H 'Origin: https://jsuk5993-crypto.github.io' "$BASE/api/$NAME" > "$NAME.json"
          done
          python3 - <<'PY'
          import json
          db=json.load(open('db-health.json'))
          r2=json.load(open('r2-health.json'))
          setup=json.load(open('payment-setup.json'))
          print('Orders table ready:', db.get('ordersTableReady'))
          print('Private R2 assets ready:', r2.get('assetsReady'), '/', r2.get('assetsExpected'))
          print('TEST checkout enabled:', setup.get('paymentsEnabled'))
          print('TEST staging gate:', setup.get('testAccessReady'))
          assert db.get('ok') is True, 'D1 orders table is not ready'
          assert r2.get('ok') is True, 'Private R2 premium assets are missing'
          assert setup.get('mode') == 'test', 'Not in TEST mode'
          assert setup.get('testAccessReady') is True, 'TEST access gate unavailable'
          print('PASS: all components needed for existing buyer restoration are configured')
          PY
