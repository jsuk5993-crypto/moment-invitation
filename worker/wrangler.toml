# MOMENT Build 26: mandatory staging password without an optional dashboard toggle; payments OFF.
name = "moment-payments-test"
main = "src/worker.mjs"
compatibility_date = "2026-10-20"

[vars]
PAYMENTS_ACTIVE = "false"
PAYMENTS_MODE = "test"
PUBLIC_ORIGIN = "https://jsuk5993-crypto.github.io"
# Staging password protection is always ON in code. No TEST_ACCESS_REQUIRED variable.

# Values must never be saved in GitHub or the [vars] block.
# Wrangler validates that these encrypted Cloudflare Secrets exist before deploying.
[secrets]
required = ["TOSS_CLIENT_KEY", "TOSS_SECRET_KEY", "TEST_ACCESS_SECRET"]

[[d1_databases]]
binding = "DB"
database_name = "moment-orders"
database_id = "c86c6827-7982-457f-9049-60991d782a85"

[[r2_buckets]]
binding = "PREMIUM_ASSETS"
bucket_name = "moment-premium-private"

[assets]
directory = "../site"
binding = "STAGING_ASSETS"
run_worker_first = true

# Secret: TEST_ACCESS_SECRET (>=24 characters) must be added only in Cloudflare.
# Test ck/sk secrets are also stored there. Never commit secret values.
