# MOMENT Build 28: keep dashboard variable bindings across deployments; staging payment OFF.
name = "moment-payments-test"
main = "src/worker.mjs"
compatibility_date = "2026-10-20"
# Preserve bindings added in the Cloudflare Dashboard on subsequent Wrangler deploys.
# Note: Secret-type bindings should be preserved by Cloudflare even without this flag.
keep_vars = true

[vars]
PAYMENTS_ACTIVE = "false"
PAYMENTS_MODE = "test"
PUBLIC_ORIGIN = "https://jsuk5993-crypto.github.io"
# Staging password protection is always ON in code. No TEST_ACCESS_REQUIRED variable.

# Runtime Secrets must be added under Worker Settings > Variables and Secrets:
# TOSS_CLIENT_KEY, TOSS_SECRET_KEY, TEST_ACCESS_SECRET.
# Do not use [secrets].required in automatic deployment here: Cloudflare's
# build environment currently cannot find TEST_ACCESS_SECRET at deploy time.
# Runtime protection in worker.mjs/staging.mjs fails closed if it is absent.

[[d1_databases]]
binding = "DB"
database_name = "moment-orders"
database_id = "c86c6827-7982-457f-9049-60991d782a85"

[[r2_buckets]]
binding = "PREMIUM_ASSETS"
bucket_name = "moment-premium-private"

[assets]
directory = "../site"
binding = "STAGING_ASSETS"
run_worker_first = true

# Secret: TEST_ACCESS_SECRET (>=24 characters) must be added only in Cloudflare.
# Test ck/sk secrets are also stored there. Never commit secret values.
