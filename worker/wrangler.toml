# MOMENT Build 24: fail-closed staging checkout, OFF pending access validation.
name = "moment-payments-test"
main = "src/worker.mjs"
compatibility_date = "2026-10-20"

[vars]
PAYMENTS_ACTIVE = "false"
PAYMENTS_MODE = "test"
TEST_ACCESS_REQUIRED = "true"
PUBLIC_ORIGIN = "https://jsuk5993-crypto.github.io"

[[d1_databases]]
binding = "DB"
database_name = "moment-orders"
database_id = "c86c6827-7982-457f-9049-60991d782a85"

[[r2_buckets]]
binding = "PREMIUM_ASSETS"
bucket_name = "moment-premium-private"

[assets]
directory = "../site"
binding = "STAGING_ASSETS"
run_worker_first = true

# Secret: TEST_ACCESS_SECRET (>=24 characters) must be added only in Cloudflare.
# Test ck/sk secrets are also stored there. Never commit secret values.
